<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beats | luvbesly Catalog</title>
    <meta name="description" content="Stream and purchase premium, raw trap beats, experimental instrumentals, and underground sound kits by LUVBESLY. Instant license delivery for artists and producers.">
    <meta name="author" content="luvbesly">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#000000">
    <link rel="canonical" href="https://luvbesly.com/beats.html">

    <!-- OPEN GRAPH -->
    <meta property="og:site_name" content="luvbesly">
    <meta property="og:title" content="Buy Trap, Dark &amp; Experimental Beats | LUVBESLY Catalog">
    <meta property="og:description" content="Stream and purchase premium, raw instrumentals and underground sound kits by LUVBESLY. Instant delivery.">
    <meta property="og:image" content="https://luvbesly.com/og-image.png">
    <meta property="og:image:alt" content="luvbesly beat catalog">
    <meta property="og:url" content="https://luvbesly.com/beats.html">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">

    <!-- TWITTER CARD -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="LUVBESLY Beat Catalog | High-Quality Instrumentals">
    <meta name="twitter:description" content="Raw trap, dark and experimental beats. Instant licensing and high-quality WAV/MP3 delivery.">
    <meta name="twitter:image" content="https://luvbesly.com/og-image.png">

    <!-- FAVICON -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Orbitron:wght@800;900&display=swap">

    <!-- ESTILOS -->
    <link rel="stylesheet" href="/css/style.css?v=3">
</head>
<body>

    <a href="#main" class="skip-link">Skip to content</a>

    <header>
        <a href="/" class="logo">LUVBESLY</a>

        <button class="hamburger" id="hamburger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="main-nav" aria-label="Main">
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/videos.html">Videos</a></li>
                <li><a href="/beats.html" class="active" aria-current="page">Beats</a></li>
                <li><a href="/kits.html">Sound Kits</a></li>
                <li><a href="/vsts.html">VST Vault</a></li>
                <li><a href="https://app.luvbesly.com">Send Log</a></li>
            </ul>
        </nav>
    </header>

    <main id="main" class="beats-container">
        <div class="beats-header">
            <h1>BEAT CATALOG</h1>
            <p>Instant delivery</p>
        </div>

        <!-- El JS rellena esta lista desde /data/beats.json -->
        <div class="beats-list" id="beats-list" aria-busy="true">
            <p class="loading-state">Loading beats…</p>
        </div>

        <noscript>
            <p class="loading-state">Enable JavaScript to preview the beats, or browse the full catalog on BeatStars.</p>
        </noscript>

        <div class="show-all-container">
            <a href="https://www.beatstars.com/luvbesly" target="_blank" rel="noopener noreferrer" class="btn-show-all">
                SHOW ALL BEATS
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="year">2026</span> LUVBESLY. All Rights Reserved.</p>
        <p class="legal-link"><a href="/privacy.html">Privacy Policy</a></p>
    </footer>

    <!-- Reproductor global: solo existe en esta página, que es la única con audio -->
    <aside id="global-player" class="global-player hidden" aria-label="Audio player">
        <div class="player-container">
            <div class="player-track-info">
                <h4 id="player-title">NONE</h4>
                <span id="player-bpm">000 BPM</span>
            </div>

            <div class="player-controls">
                <div class="player-buttons">
                    <button id="player-prev-btn" class="ctrl-btn" type="button" aria-label="Previous track">
                        <span aria-hidden="true">⏮</span>
                    </button>
                    <button id="player-play-btn" class="ctrl-btn main-play" type="button" aria-label="Play">
                        <span aria-hidden="true">▶</span>
                    </button>
                    <button id="player-next-btn" class="ctrl-btn" type="button" aria-label="Next track">
                        <span aria-hidden="true">⏭</span>
                    </button>
                </div>

                <div class="player-timeline">
                    <span id="player-current-time" class="time-code">0:00</span>
                    <div id="progress-bar-container"
                         class="progress-container"
                         role="slider"
                         tabindex="0"
                         aria-label="Seek"
                         aria-valuemin="0"
                         aria-valuemax="100"
                         aria-valuenow="0"
                         aria-valuetext="0:00">
                        <div id="progress-bar" class="progress-bar"></div>
                    </div>
                    <span id="player-duration" class="time-code">0:00</span>
                </div>
            </div>

            <div class="player-utility">
                <span class="vol-icon" aria-hidden="true">🔊</span>
                <input type="range" id="player-volume" class="vol-slider" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
            </div>
        </div>
    </aside>

    <script type="module" src="/js/main.js"></script>

</body>
</html>
